name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Package repository
        run: git archive --format=zip --prefix=efg/ --output=efg-source.zip "$GITHUB_SHA"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$TAG" bin/* efg-source.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
